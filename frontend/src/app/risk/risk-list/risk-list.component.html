<div class="container">
  <h2 class="mb-4">Comité de Riesgo - Solicitudes Pendientes</h2>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Identificación</th>
              <th>Nombre</th>
              <th>Monto</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let app of applications">
              <td>{{ app.id }}</td>
              <td>{{ app.identification }}</td>
              <td>{{ app.fullName }}</td>
              <td>{{ app.requestedAmount | number:'1.2-2' }}</td>
              <td>{{ app.createdAt | date:'short' }}</td>
              <td>
                <a [routerLink]="['/risk', app.id]" class="btn btn-sm btn-primary">Revisar</a>
              </td>
            </tr>
            <tr *ngIf="applications.length === 0">
              <td colspan="6" class="text-center text-muted">No hay solicitudes pendientes</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
